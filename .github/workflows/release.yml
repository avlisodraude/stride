name: Release

# Not yet the active release path: publishing still happens locally via
# `npm run release`. To cut over, the maintainer must add an NPM_TOKEN
# secret (an npm automation token with publish rights) and start pushing
# `vX.Y.Z` tags instead of running `npm publish` from a laptop. Provenance
# (--provenance below) can only be attached when publishing from a CI
# environment with OIDC support (the id-token: write permission) — it
# cannot be produced by a local `npm publish`, which is why the local
# release script correctly omits that flag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Validate release tag and committed source
        run: npm run release:preflight

      - name: Install dependencies
        run: npm ci

      - name: Install browser checks
        run: npm run browser:install -- --with-deps

      - name: Verify release
        run: npm run check

      - name: Validate pinned Garmin exports
        run: npm run fixtures:exports && npm run test:real

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured; publish from the verified local checkout."
            exit 0
          fi
          npm publish --access public --provenance
