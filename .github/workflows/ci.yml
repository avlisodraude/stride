name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One Node version failing shouldn't hide results from the others —
      # the whole point of the matrix is proving the `engines` claim
      # (>= 18) on every major we support.
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]

    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `pretest` runs the full build (tsup + browser bundle), so this also
      # verifies the package builds on every supported Node major.
      - name: Test
        run: npm test

      - name: Verify packed package consumers
        run: npm run test:package

      - name: Run examples
        run: npm run test:examples

      - name: Check large-file performance
        if: matrix.node == 22
        run: npm run test:performance

      - name: Install browser checks
        if: matrix.node == 22
        run: npm run browser:install -- --with-deps

      - name: Render charts in Chromium
        if: matrix.node == 22
        run: npm run test:browser

      - uses: actions/upload-artifact@v4
        if: matrix.node == 22 && always()
        with:
          name: browser-chart-checks
          path: test-results/browser/
          if-no-files-found: ignore
